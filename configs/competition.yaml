competition:
  id: "comp_4795"
  name: "Campeonato Brasileiro Série A"
  country: "Brazil"
  country_code: "BR"

seasons_to_fetch:
  - current          # siempre la temporada activa
  - previous         # temporada anterior completa
  - previous-2       # hace 2 temporadas
  - previous-3       # hace 3 temporadas para mayor volumen de datos

api:
  base_url: "https://api.thestatsapi.com/api"
  max_per_page: 100
  request_timeout: 30
  max_retries: 3
  retry_backoff_seconds: 2
  requests_per_second: 2
  circuit_breaker_threshold: 3

cache:
  enabled: true
  ttl_hours: 12

prediction:
  days_ahead: 14
  min_confidence: 0.35

storage:
  data_dir: "data"
  matches_file: "matches.parquet"
  stats_file: "match_stats.parquet"
  odds_file: "odds.parquet"
  features_file: "features.parquet"
  standings_file: "standings.parquet"
