poisson:
  alpha: 1.0

xgboost:
  n_estimators: 300
  max_depth: 5
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42

catboost:
  iterations: 400
  depth: 6
  learning_rate: 0.05
  random_seed: 42

decision_tree:
  max_depth: 8
  min_samples_leaf: 20

logistic_model:
  C: 1.0
  max_iter: 500
  solver: "lbfgs"
  random_state: 42

ensemble:
  optimization:
    method: "scipy.optimize"
    metric: "log_loss"
    bounds: [0.0, 1.0]
  weights:
    poisson: 0.20
    xgboost: 0.30
    catboost: 0.30
    decision_tree: 0.10
    logistic_model: 0.10

calibration:
  method: "isotonic"
  n_bins: 10

cross_validation:
  n_splits: 5
  test_size: 50

features:
  rolling_window: 5
  min_history_matches: 3
