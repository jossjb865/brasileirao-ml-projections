name: Train Ensemble

on:
  # Triggered automatically when Daily Data Sync completes successfully
  workflow_run:
    workflows: ["Daily Data Sync (Brasileirão)"]
    types: [completed]
  # Also allow manual dispatch
  workflow_dispatch:

concurrency:
  group: train_ensemble-${{ github.ref }}
  cancel-in-progress: true

jobs:
  train:
    # Only run if triggered by a successful upstream workflow, or by manual dispatch
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download data artifact from latest sync run
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: brasileirao-data
          path: data/

      - name: Ensure data exists (Fast fallback - matches + stats only, skip odds)
        env:
          THESTATS_API_KEY: ${{ secrets.THESTATS_API_KEY }}
        run: |
          if [ ! -f data/matches.parquet ]; then
            echo "Data artifact not found. Executing fast fallback fetch (matches + stats only)..."
            python -m src.data.fetch --no-odds
            python -m src.data.features
          else
            echo "Data artifact found. Skipping fetch."
          fi

      - name: Train ensemble with backtesting and CV
        env:
          THESTATS_API_KEY: ${{ secrets.THESTATS_API_KEY }}
        run: python -m src.train

      - name: Upload models artifact
        uses: actions/upload-artifact@v4
        with:
          name: brasileirao-models
          path: models/
          retention-days: 30

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: brasileirao-metrics
          path: outputs/metrics.json
          retention-days: 30

      - name: Report failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Workflow Failure] Train Ensemble failed on ${new Date().toISOString().split('T')[0]}`,
              body: `The Train Ensemble workflow failed. Please inspect the logs here: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })
