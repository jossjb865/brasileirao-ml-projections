name: Train Ensemble

on:
  schedule:
    - cron: "0 6 * * 1"   # Lunes 06:00 UTC
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Ya no dependemos de artefactos de otros workflows
      - name: Fetch + Features (siempre, datos reales)
        env:
          THESTATS_API_KEY: ${{ secrets.THESTATS_API_KEY }}
        run: |
          python -m src.data.fetch
          python -m src.data.features

      - name: Train ensemble
        env:
          THESTATS_API_KEY: ${{ secrets.THESTATS_API_KEY }}
        run: python -m src.train

      - name: Upload models
        uses: actions/upload-artifact@v4
        with:
          name: brasileirao-models
          path: models/
          retention-days: 30
