name: Daily Data Sync (Brasileirão)

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch real data from TheStatsAPI
        env:
          THESTATS_API_KEY: ${{ secrets.THESTATS_API_KEY }}
        run: python -m src.data.fetch

      - name: Build features
        env:
          THESTATS_API_KEY: ${{ secrets.THESTATS_API_KEY }}
        run: python -m src.data.features

      - name: Upload data artifacts
        uses: actions/upload-artifact@v4
        with:
          name: brasileirao-data
          path: data/
          retention-days: 14
