name: Predict & Publish

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Autosuficiente: descarga datos + entrena si hace falta
      - name: Ensure data exists
        env:
          THESTATS_API_KEY: ${{ secrets.THESTATS_API_KEY }}
        run: |
          python -m src.data.fetch
          python -m src.data.features

      - name: Ensure models exist (entrenar si no hay)
        env:
          THESTATS_API_KEY: ${{ secrets.THESTATS_API_KEY }}
        run: |
          if [ ! -f models/ensemble_weights.joblib ]; then
            echo "No hay modelos. Entrenando..."
            python -m src.train
          else
            echo "Modelos encontrados."
          fi

      - name: Generate predictions
        env:
          THESTATS_API_KEY: ${{ secrets.THESTATS_API_KEY }}
        run: python -m src.predict

      - name: Upload predictions
        uses: actions/upload-artifact@v4
        with:
          name: brasileirao-predictions
          path: outputs/
          retention-days: 30
