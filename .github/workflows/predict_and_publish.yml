name: Predict & Publish

on:
  # Triggered automatically when Train Ensemble completes successfully
  workflow_run:
    workflows: ["Train Ensemble"]
    types: [completed]
  # Also allow manual dispatch
  workflow_dispatch:

concurrency:
  group: predict_and_publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  predict:
    # Only run if triggered by a successful upstream workflow, or by manual dispatch
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download data artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: brasileirao-data
          path: data/

      - name: Download models artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: brasileirao-models
          path: models/

      - name: Ensure data exists (Fast fallback - matches only)
        env:
          THESTATS_API_KEY: ${{ secrets.THESTATS_API_KEY }}
        run: |
          if [ ! -f data/matches.parquet ]; then
            echo "Data missing. Executing fast fallback fetch (matches only, no stats/odds)..."
            python -m src.data.fetch --skip-stats --skip-odds
            python -m src.data.features
          else
            echo "Data artifact found. Skipping fetch."
          fi

      - name: Ensure models exist (Fallback train)
        env:
          THESTATS_API_KEY: ${{ secrets.THESTATS_API_KEY }}
        run: |
          if [ ! -f models/ensemble.joblib ]; then
            echo "Models missing. Executing fallback ensemble training..."
            python -m src.train
          else
            echo "Models artifact found. Skipping training."
          fi

      - name: Generate predictions
        env:
          THESTATS_API_KEY: ${{ secrets.THESTATS_API_KEY }}
        run: python -m src.predict

      - name: Upload predictions artifact
        uses: actions/upload-artifact@v4
        with:
          name: brasileirao-predictions
          path: outputs/
          retention-days: 30

      - name: Report failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Workflow Failure] Predict & Publish failed on ${new Date().toISOString().split('T')[0]}`,
              body: `The Predict & Publish workflow failed. Please inspect the logs here: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })
