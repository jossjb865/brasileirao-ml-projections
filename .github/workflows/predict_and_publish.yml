name: Predict & Publish

on:
  schedule:
    - cron: "30 6 * * *"  # 06:30 UTC diario
  workflow_dispatch:

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download models
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: brasileirao-models
          path: models/

      - name: Download data
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: brasileirao-data
          path: data/

      - name: Ensure data & models exist
        env:
          THESTATS_API_KEY: ${{ secrets.THESTATS_API_KEY }}
        run: |
          if [ ! -f data/features.parquet ]; then
            python -m src.data.fetch
            python -m src.data.features
          fi
          if [ ! -f models/ensemble_weights.joblib ]; then
            python -m src.train
          fi

      - name: Generate predictions
        env:
          THESTATS_API_KEY: ${{ secrets.THESTATS_API_KEY }}
        run: |
          python -m src.predict

      - name: Upload predictions
        uses: actions/upload-artifact@v4
        with:
          name: brasileirao-predictions
          path: outputs/
          retention-days: 30
