name: Predict & Publish

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

concurrency:
  group: predict_and_publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download data artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: brasileirao-data
          path: data/

      - name: Download models artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: brasileirao-models
          path: models/

      - name: Ensure data exists (Fallback fetch)
        env:
          THESTATS_API_KEY: ${{ secrets.THESTATS_API_KEY }}
        run: |
          if [ ! -f data/matches.parquet ]; then
            echo "Data missing. Executing fallback fetch and feature build..."
            python -m src.data.fetch
            python -m src.data.features
          fi

      - name: Ensure models exist (Fallback train)
        env:
          THESTATS_API_KEY: ${{ secrets.THESTATS_API_KEY }}
        run: |
          if [ ! -f models/ensemble.joblib ]; then
            echo "Models missing. Executing fallback ensemble training..."
            python -m src.train
          fi

      - name: Generate predictions
        env:
          THESTATS_API_KEY: ${{ secrets.THESTATS_API_KEY }}
        run: python -m src.predict

      - name: Upload predictions artifact
        uses: actions/upload-artifact@v4
        with:
          name: brasileirao-predictions
          path: outputs/
          retention-days: 30

      - name: Report failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Workflow Failure] Predict & Publish failed on ${new Date().toISOString().split('T')[0]}`,
              body: `The Predict & Publish workflow failed. Please inspect the logs here: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })
