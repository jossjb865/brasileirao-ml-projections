[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brasileirao-ml-projections"
version = "1.0.0"
description = "Ensemble ML para proyección de mercados del Brasileirão Série A con datos reales de TheStatsAPI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Brasileirao ML" }]

dependencies = [
  "requests>=2.32.0",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "pyarrow>=15.0.0",
  "scikit-learn>=1.4.0",
  "xgboost>=2.0.0",
  "catboost>=1.2.0",
  "tensorflow>=2.15.0",
  "keras>=3.0.0",
  "joblib>=1.3.0",
  "pyyaml>=6.0",
  "tqdm>=4.66.0",
  "python-dateutil>=2.9.0",
  "statsmodels>=0.14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"
